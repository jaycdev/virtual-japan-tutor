name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go server
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vjt
          POSTGRES_PASSWORD: vjt_ci_password
          POSTGRES_DB: vjt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vjt -d vjt"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://vjt:vjt_ci_password@localhost:5432/vjt?sslmode=disable
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.21.0
      - name: go vet
        run: go vet ./...
      - name: gofmt
        run: node scripts/gofmt-check.mjs
      - name: go test
        run: go test ./...
      - name: go build
        run: go build -o bin/ ./cmd/server ./cmd/import

  node:
    name: Node packages and generated code
    runs-on: ubuntu-latest
    env:
      # Turbo's local cache, persisted by the cache step below. Set explicitly because the
      # default location has changed between Turbo major versions.
      TURBO_CACHE_DIR: .turbo/cache
    steps:
      - uses: actions/checkout@v7.0.1
      # Go is needed only because generate:force runs go generate (api.gen.go, which
      # check:generated verifies). The Go server's vet, test and build run in the go job,
      # so the turbo step below excludes @vjt/server.
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore Turbo cache
        uses: actions/cache@v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-
      - name: Regenerate from OpenAPI spec and fail if committed output is stale
        run: |
          pnpm generate:force
          pnpm check:generated
        env:
          # --force overwrites existing cache entries. Read-only turbo cache keeps this
          # regeneration from writing into the cache that is saved for later runs.
          TURBO_CACHE: local:r
      - name: Lint, typecheck, test and build (Go server excluded)
        run: pnpm exec turbo run lint typecheck test build --filter='!@vjt/server'

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    env:
      # The web stage pins FROM --platform=$BUILDPLATFORM, which needs BuildKit.
      DOCKER_BUILDKIT: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      # Builds both Dockerfile targets without pushing (publishing happens in publish.yml on main).
      - name: Build server image (API + web app)
        run: docker build --target server -f apps/server/Dockerfile -t vjt-server:ci .
      - name: Build import image
        run: docker build --target import -f apps/server/Dockerfile -t vjt-import:ci .
      # The web stage must have baked the real Vite build: index.html with hashed
      # /assets/ references (not the old placeholder text), and every asset it
      # references actually in the image.
      - name: Server image carries the built web app
        run: |
          docker run --rm --entrypoint sh vjt-server:ci -c '
          set -eu
          cd /usr/share/vjt/web
          test -f index.html
          if grep -q "being rebuilt" index.html; then
            echo "index.html is still the placeholder page (#82)"
            exit 1
          fi
          grep -q "/assets/" index.html
          for f in $(grep -o "/assets/[^\" ]*" index.html | sort -u); do
            test -f ".$f" || { echo "index.html references $f, which is not in the image"; exit 1; }
          done
          '

  # Builds the Android APK on PRs that touch the mobile app, its shared packages or the lockfile,
  # so native build breakage shows up before main (ADR-0012). The job always runs and reports
  # success when the change does not touch those paths, so it can stay a required check.
  # Unsigned: PR builds never see the signing secrets.
  android:
    name: Android APK build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: changes
        name: Decide whether the APK build is needed
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Three dots: the changes this PR makes, not changes that landed on main after it branched.
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")
          if echo "$changed" | grep -Eq '^(apps/mobile/|packages/|pnpm-lock\.yaml$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v6.1.0
        if: steps.changes.outputs.run == 'true'
      - uses: actions/setup-node@v7.1.0
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: 24.21.0
          cache: pnpm
      - uses: actions/setup-java@v6.2.0
        if: steps.changes.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6.4.1
        if: steps.changes.outputs.run == 'true'
      - name: Install and build the mobile app's dependencies
        if: steps.changes.outputs.run == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter "@vjt/mobile^..." build
      - name: Build the unsigned release APK
        if: steps.changes.outputs.run == 'true'
        working-directory: apps/mobile
        run: pnpm build:apk
      - uses: actions/upload-artifact@v7.0.2
        if: steps.changes.outputs.run == 'true'
        with:
          name: vjt-android-pr-${{ github.event.pull_request.number || github.sha }}
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
