name: Publish images

# Publishes the server and the reference-data import image to GitHub Container Registry.
#   push to main   -> :dev (and :sha-<commit>)
#   push of vX.Y.Z -> :X.Y.Z, :X.Y and :latest   (pre-release tags such as v1.0.0-rc.1 never move :latest)
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  # Started by release.yml after it pushes a release tag (a tag pushed with GITHUB_TOKEN would not
  # start this workflow). The ref-check job refuses any manual run that is not for a release tag.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Pushes pass straight through. A manual run must target a release tag, so no branch can move
  # the dev tag or the dev APK (ADR-0014).
  ref-check:
    name: Check the ref
    runs-on: ubuntu-latest
    steps:
      - name: Manual runs target a release tag
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" != "workflow_dispatch" ]; then exit 0; fi
          if [ "$REF_TYPE" != "tag" ] || ! echo "$REF_NAME" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$'; then
            echo "::error::A manual run must target a release tag (vX.Y.Z or vX.Y.Z-rc.N), not $REF_NAME"
            exit 1
          fi

  images:
    name: ${{ matrix.target }} image
    needs: ref-check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [server, import]
    steps:
      - uses: actions/checkout@v7.0.1
      # Go is cross-compiled natively; QEMU is only needed for the tiny `RUN adduser` in the arm64 final stage.
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/virtual-japan-tutor-${{ matrix.target }}
          flavor: latest=false
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
      # The server reports this on GET /health (internal/buildinfo): the release version, or dev+<commit> on main.
      - id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            value="${GITHUB_REF_NAME#v}"
          else
            value="dev+${GITHUB_SHA::7}"
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: apps/server/Dockerfile
          target: ${{ matrix.target }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max

  # Signed Android APK (ADR-0012). A tag vX.Y.Z creates its GitHub Release with the APK attached
  # (pre-releases for -rc tags). A push to main moves the dev tag and updates the rolling `dev`
  # pre-release with the dev app. Like the images, this does not wait for CI; release.yml checks CI before it tags (ADR-0014).
  android:
    name: Android APK
    needs: ref-check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check the signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing ANDROID_KEYSTORE_BASE64 (secret)"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD (secret)"
          [ -n "$KEY_PASSWORD" ] || missing="$missing ANDROID_KEY_PASSWORD (secret)"
          [ -n "$KEY_ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS (variable)"
          if [ -n "$missing" ]; then
            echo "::error::Android signing is not configured. Missing:$missing. Refusing to publish an unsigned APK."
            exit 1
          fi
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Install and build the mobile app's dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter "@vjt/mobile^..." build
      - name: Work out the version and variant
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            node apps/mobile/scripts/print-android-version.mjs release "$GITHUB_REF_NAME" >> "$GITHUB_ENV"
            echo "APP_VARIANT=release" >> "$GITHUB_ENV"
          else
            node apps/mobile/scripts/print-android-version.mjs dev "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" >> "$GITHUB_ENV"
            echo "APP_VARIANT=dev" >> "$GITHUB_ENV"
          fi
      - name: Build and sign the APK
        working-directory: apps/mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vjt-release.jks"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/vjt-release.jks"
          pnpm build:apk
          rm -f "$RUNNER_TEMP/vjt-release.jks"
      - name: Verify the signature and name the assets
        run: |
          set -euo pipefail
          built=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$built"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            NAME="virtual-japan-tutor-$APP_VERSION_NAME"
          else
            NAME="virtual-japan-tutor-dev"
          fi
          mkdir -p release-assets
          cp "$built" "release-assets/$NAME.apk"
          (cd release-assets && sha256sum "$NAME.apk" > "$NAME.apk.sha256")
          echo "ASSET=release-assets/$NAME.apk" >> "$GITHUB_ENV"
          echo "CHECKSUM=release-assets/$NAME.apk.sha256" >> "$GITHUB_ENV"
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            prerelease=""
            case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
            # release.yml tags with grouped notes (ADR-0014). A lightweight tag pushed by hand has none.
            tag_type=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq .object.type)
            if [ "$tag_type" = "tag" ]; then notes="--notes-from-tag"; else notes="--generate-notes"; fi
            gh release create "$GITHUB_REF_NAME" $ASSET $CHECKSUM \
              --title "$GITHUB_REF_NAME" $notes $prerelease
          else
            # Move the dev tag to this commit, then refresh the rolling pre-release.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/dev" -f sha="$GITHUB_SHA" -F force=true \
              || gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/dev -f sha="$GITHUB_SHA"
            if ! gh release view dev >/dev/null 2>&1; then
              gh release create dev --prerelease --verify-tag --title "VJT Dev (rolling)" \
                --notes "Rolling build of main for the separate VJT Dev app. Replaced on every push to main."
            fi
            gh release upload dev $ASSET $CHECKSUM --clobber
          fi
