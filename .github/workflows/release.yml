name: Release

# Cuts a version tag from the conventional commit history (ADR-0014). Runs on demand only.
# The tag points at the commit this run starts on, which must be main with a passing CI run.
# Then it starts publish.yml for the tag. A tag pushed with GITHUB_TOKEN would not start it, so
# the dispatch is explicit.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Show the version, commits and notes in the job summary; create no tag
        type: boolean
        default: false
      prerelease:
        description: Cut a release candidate (vX.Y.Z-rc.N) instead of a final release
        type: boolean
        default: false
      release_as:
        description: Exact version to tag (X.Y.Z or X.Y.Z-rc.N); empty computes it from the commits
        type: string
        default: ""

permissions:
  contents: write
  actions: write # read the CI runs, and start publish.yml

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Cut the release
    runs-on: ubuntu-latest
    steps:
      - name: Releases come from main only
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are cut from main, not from $GITHUB_REF"
            exit 1
          fi

      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.21.0

      - name: Require a passing CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The newest push-to-main CI run for this commit decides. A run still in progress does not pass.
          state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&branch=main&per_page=100" \
            --jq 'if (.workflow_runs | length) == 0 then "none" else (.workflow_runs | sort_by(.created_at) | last | "\(.status):\(.conclusion // "")") end')
          if [ "$state" != "completed:success" ]; then
            echo "::error::The latest CI run for $GITHUB_SHA is '$state', not 'completed:success'. Let CI pass, then run this workflow again."
            exit 1
          fi
          echo "CI passed for $GITHUB_SHA."

      - name: Compute the version and notes
        id: plan
        env:
          PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_AS: ${{ inputs.release_as }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          args=(--ref "$GITHUB_SHA" --notes-file "$RUNNER_TEMP/notes.md" --summary-file "$RUNNER_TEMP/summary.md")
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          if [ -n "$RELEASE_AS" ]; then args+=(--release-as "$RELEASE_AS"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          node scripts/next-version.mjs "${args[@]}" >> "$GITHUB_OUTPUT"

      - name: Job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/summary.md" ]; then cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Check the tag against the Android version rules
        env:
          TAG: ${{ steps.plan.outputs.TAG }}
        run: node apps/mobile/scripts/print-android-version.mjs release "$TAG"

      - name: Tag the commit
        if: success() && !inputs.dry_run
        env:
          TAG: ${{ steps.plan.outputs.TAG }}
          SHA: ${{ steps.plan.outputs.SHA }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # verbatim keeps the "###" headings; git's default cleanup would strip them as comments.
          git tag -a "$TAG" --cleanup=verbatim -F "$RUNNER_TEMP/notes.md" "$SHA"
          git push origin "refs/tags/$TAG"

      - name: Start publish.yml for the tag
        if: success() && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.TAG }}
        run: |
          set -euo pipefail
          gh workflow run publish.yml --ref "$TAG"
          echo "::notice::Started publish.yml for $TAG: https://github.com/$GITHUB_REPOSITORY/actions/workflows/publish.yml"
