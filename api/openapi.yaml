openapi: 3.0.3
info:
  title: Virtual Japan Tutor API
  version: 0.1.0
  description: >
    Source of truth for the HTTP API. Go server stubs and the TypeScript
    client are both generated from this file (run `pnpm generate`).
servers:
  - url: http://localhost:8080
# Authenticated by default: every operation requires a bearer session token unless it
# explicitly opts out with `security: []` (only /health and /auth/login do).
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      summary: Liveness and database connectivity check
      responses:
        "200":
          description: Server is up and the database is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Server is up but the database is unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /auth/login:
    post:
      operationId: login
      summary: Exchange a username and password for a session token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unknown user or wrong password (indistinguishable by design)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many failed attempts; retry after the number of seconds in Retry-After
          headers:
            Retry-After:
              required: true
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/logout:
    post:
      operationId: logout
      summary: Invalidate the current session token
      responses:
        "204":
          description: Session deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me:
    get:
      operationId: getMe
      summary: The authenticated user
      responses:
        "200":
          description: The current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /grammar/points:
    get:
      operationId: listGrammarPoints
      summary: Grammar points in catalogue order (level N5→N1, then catalogue number)
      parameters:
        - name: level
          in: query
          required: false
          schema:
            type: string
            enum: [N5, N4, N3, N2, N1]
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: A page of grammar points with their content status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrammarPointPage"
        "400":
          description: Unknown level or out-of-range limit/offset (code `bad_request`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /grammar/points/{id}:
    parameters:
      - $ref: "#/components/parameters/GrammarPointId"
    get:
      operationId: getGrammarPoint
      summary: Read a grammar point, generating missing content on first read
      description: >
        When the point has no explanation yet, or holds fewer than 5 example sentences, the server
        asks the AI Provider assigned to the `grammar_content` task and stores what it returns: the
        explanation first, then validated example sentences up to 5. Existing content is never
        replaced. A point with no content and no assigned provider is still answered 200 with an
        empty `explanation` and no `examples`.
      responses:
        "200":
          description: The grammar point with its explanation and validated example sentences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrammarPointDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateGrammarPoint
      summary: Edit the explanation of a grammar point
      description: >
        Manual edits are kept: regeneration and auto-generation never overwrite an explanation
        that was edited here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrammarPointUpdate"
      responses:
        "200":
          description: The updated grammar point
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrammarPointDetail"
        "400":
          description: Empty explanation or malformed body (code `bad_request`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /grammar/points/{id}/examples:
    parameters:
      - $ref: "#/components/parameters/GrammarPointId"
    post:
      operationId: generateGrammarExamples
      summary: Generate example sentences, validating each against JMdict before storing it
      description: >
        Candidates are generated through the assigned AI Provider and discarded when they fail
        validation (the sentence or its grammar span must tokenise into known JMdict words, the
        span must cover part of the pattern, and its length must be 5–40 characters). Rejected
        candidates are reported here, never stored.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateExamplesRequest"
      responses:
        "200":
          description: The newly stored examples plus counts of rejected candidates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationResult"
        "400":
          description: Out-of-range count or malformed body (code `bad_request`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: No AI Provider is assigned to the `grammar_content` task (code `no_ai_provider`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /grammar/points/{id}/explanation/regenerate:
    parameters:
      - $ref: "#/components/parameters/GrammarPointId"
    post:
      operationId: regenerateGrammarExplanation
      summary: Regenerate the explanation, replacing any existing one
      responses:
        "200":
          description: The grammar point with its new explanation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrammarPointDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: No AI Provider is assigned to the `grammar_content` task (code `no_ai_provider`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /ai-providers:
    get:
      operationId: listAiProviders
      summary: The Learner's saved AI Providers
      responses:
        "200":
          description: All providers, oldest first. API keys are never included.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiProvider"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createAiProvider
      summary: Save a new AI Provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiProviderCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiProvider"
        "400":
          description: Invalid name, base URL or model (code `invalid_provider`) or malformed body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: A provider with this name already exists (code `name_taken`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /ai-providers/{id}:
    parameters:
      - $ref: "#/components/parameters/ProviderId"
    get:
      operationId: getAiProvider
      summary: One AI Provider
      responses:
        "200":
          description: The provider (without its key)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiProvider"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateAiProvider
      summary: Change an AI Provider
      description: >
        Only the fields present are changed. `apiKey` omitted keeps the stored key; `null` or
        an empty string removes it (keyless endpoints such as Ollama need none).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiProviderUpdate"
      responses:
        "200":
          description: The updated provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiProvider"
        "400":
          description: Invalid name, base URL or model (code `invalid_provider`) or malformed body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Another provider already has this name (code `name_taken`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteAiProvider
      summary: Remove an AI Provider
      description: Rejected with 409 while the provider is assigned to a task; reassign the task first.
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The provider is assigned to a task (code `provider_in_use`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /ai-providers/{id}/test:
    parameters:
      - $ref: "#/components/parameters/ProviderId"
    post:
      operationId: testAiProvider
      summary: Check that the provider answers a tiny chat request
      description: >
        Always answers 200 when the provider exists; a failed check is `ok: false` with a
        readable `message`, not an HTTP error.
      responses:
        "200":
          description: The outcome of the check
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiProviderTestResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /ai-tasks:
    get:
      operationId: listAiTasks
      summary: Which AI Provider each task uses
      responses:
        "200":
          description: One entry per task, in a stable order; `providerId` is null when unassigned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiTaskAssignment"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /ai-tasks/{task}:
    put:
      operationId: setAiTask
      summary: Choose the AI Provider for a task
      parameters:
        - name: task
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AiTask"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerId]
              properties:
                providerId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: The new assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiTaskAssignment"
        "400":
          description: Malformed body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown task, or no such provider (code `not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: clearAiTask
      summary: Leave a task without an AI Provider
      parameters:
        - name: task
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AiTask"
      responses:
        "200":
          description: The task, now unassigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiTaskAssignment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown task (code `not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /marumori:
    get:
      operationId: getMaruMoriStatus
      summary: Whether MaruMori is connected, and what the last Sync found
      responses:
        "200":
          description: Current MaruMori status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaruMoriStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /marumori/key:
    put:
      operationId: setMaruMoriKey
      summary: Store the Learner's MaruMori API key
      description: >
        The key is encrypted at rest and never returned. It is not verified here: a rejected key
        surfaces as a failed Sync with a clear error. Replacing the key keeps already-synced data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaruMoriKeyRequest"
      responses:
        "200":
          description: Key stored; the new status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaruMoriStatus"
        "400":
          description: Missing or empty API key (code `invalid_key`) or malformed body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: deleteMaruMoriKey
      summary: Stop the MaruMori connection and forget the key
      description: Already-synced knowledge state and Sync history are kept.
      responses:
        "204":
          description: Key removed
        "401":
          $ref: "#/components/responses/Unauthorized"
  /marumori/sync:
    post:
      operationId: syncMaruMori
      summary: Sync the Learner's knowledge state from MaruMori now
      description: >
        Re-reads the Learner's Known Items and SRS levels from MaruMori and records what appeared,
        changed level or disappeared. Item content is never fetched or stored (see ADR-0002). A
        Sync that starts but fails still answers 200 with `status: "failed"` and an `error`.
      responses:
        "200":
          description: The Sync run that just finished
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaruMoriSyncRun"
        "400":
          description: No MaruMori API key stored yet (code `no_key`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: A Sync is already running for this Learner (code `sync_running`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /marumori/syncs:
    get:
      operationId: listMaruMoriSyncs
      summary: The Learner's recent Sync runs, newest first
      responses:
        "200":
          description: Recent Sync runs (a bounded window, e.g. the last 20)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaruMoriSyncRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /starting-level:
    get:
      operationId: getStartingLevel
      summary: The Learner's declared Starting Level, if they have chosen one
      description: >
        Onboarding shows its level picker while `configured` is false. Seeded Grammar — every
        Grammar Point at or below the level, known at medium Mastery — is applied when the level
        is set (issue #6).
      responses:
        "200":
          description: The current Starting Level state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartingLevelStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: setStartingLevel
      summary: Choose or change the Starting Level
      description: >
        Setting the level adds Seeded Grammar: every Grammar Point at or below it becomes a Known
        Item at medium Mastery. Changing it later adds or removes Seeded Grammar only; Observed
        Grammar from MaruMori Syncs is always kept.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartingLevelUpdate"
      responses:
        "200":
          description: The level now set, and how many points the change added or removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartingLevelStatus"
        "400":
          description: Missing or unknown level (code `invalid_level`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /grammar/review:
    get:
      operationId: listGrammarReviewItems
      summary: MaruMori grammar the Learner knows that the Catalogue Matching could not resolve cleanly
      description: >
        The settings "review these" list (issue #6): confirmed grammar observations whose Catalogue
        Matching found no Grammar Point at all, or resolved a duplicate pattern without MaruMori's
        JLPT Level. Unmatched entries are re-matched automatically by later Syncs once the
        catalogue gains the point.
      parameters:
        - name: flagged
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: false returns every observation, flagged or not, for a fuller picture.
      responses:
        "200":
          description: The Learner's grammar observations, oldest first (`observed_at`, MaruMori id as tie-break)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GrammarReviewItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /focus-set:
    get:
      operationId: getFocusSet
      summary: The rotating Focus Set of low-Mastery Known Items
      description: >
        The 15–20 Known Items Practice Sessions and Stories target (issue #7): the lowest-Mastery
        items, mixing vocabulary, kanji and grammar, in the order they should be practised. Items
        the Learner has demonstrably nailed (a run of correct Practice results across separate
        days) rotate out and the next weakest backfills; recently Observed Grammar is pinned to
        the front (docs/adr/0003). Mastery is recomputed from the stored signals on every read —
        it is never stored, and the app schedules nothing (docs/adr/0004).
      responses:
        "200":
          description: The current Focus Set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusSet"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  parameters:
    ProviderId:
      name: id
      in: path
      required: true
      description: >
        An AI Provider's UUID. Declared as a plain string on purpose: the generated router binds
        `format: uuid` parameters before the auth middleware runs, so a malformed id would be
        answered 400 to an unauthenticated caller. The handler parses it (404 if malformed).
      schema:
        type: string
    GrammarPointId:
      name: id
      in: path
      required: true
      description: >
        A grammar point's catalogue id. Declared as a plain string for the same reason as
        ProviderId: the generated router binds path parameters before auth, so the handler
        parses it itself (404 if malformed).
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Opaque session token from POST /auth/login, sent as `Authorization: Bearer <token>`."
  responses:
    Unauthorized:
      description: Missing, invalid or expired session token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such resource for the authenticated user (code `not_found`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    AiTask:
      type: string
      description: A job the app delegates to an AI Provider. Fixed set.
      enum: [story, grammar_content]
    AiProvider:
      type: object
      description: A saved OpenAI-compatible endpoint. The API key is write-only and never returned.
      required: [id, name, baseUrl, model, hasApiKey, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        baseUrl:
          type: string
          description: Normalised OpenAI-compatible base URL, e.g. https://api.openai.com/v1
        model:
          type: string
        hasApiKey:
          type: boolean
          description: Whether a key is stored. The key itself is never exposed, not even partially.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AiProviderCreate:
      type: object
      required: [name, baseUrl, model]
      properties:
        name:
          type: string
          description: Unique per Learner (case-insensitive).
        baseUrl:
          type: string
          description: Any http(s) OpenAI-compatible endpoint, including private/LAN/localhost addresses. A missing /v1 is added.
        model:
          type: string
        apiKey:
          type: string
          nullable: true
          format: password
          description: Omit, null or empty for endpoints that need no key.
          x-go-type: stdjson.RawMessage
          x-go-type-import:
            path: encoding/json
            name: stdjson
          x-go-type-skip-optional-pointer: true
    AiProviderUpdate:
      type: object
      properties:
        name:
          type: string
        baseUrl:
          type: string
        model:
          type: string
        apiKey:
          type: string
          nullable: true
          format: password
          description: Omitted keeps the stored key; null or empty removes it; any other value replaces it.
          x-go-type: stdjson.RawMessage
          x-go-type-import:
            path: encoding/json
            name: stdjson
          x-go-type-skip-optional-pointer: true
    AiProviderTestResult:
      type: object
      required: [ok, latencyMs, message]
      properties:
        ok:
          type: boolean
        latencyMs:
          type: integer
          format: int64
          description: Round-trip time of the connection check in milliseconds.
        message:
          type: string
          description: Human-readable outcome, e.g. "Connected" or why it failed.
        structuredOutput:
          type: string
          description: >
            How the endpoint handles JSON output, when the connection works: json_schema (best),
            json_object, prompt_only (JSON extracted from plain replies) or unavailable.
          enum: [json_schema, json_object, prompt_only, unavailable]
    AiTaskAssignment:
      type: object
      required: [task, providerId]
      properties:
        task:
          $ref: "#/components/schemas/AiTask"
        providerId:
          type: string
          format: uuid
          nullable: true
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable error code (e.g. unauthorized, invalid_credentials, too_many_attempts).
        message:
          type: string
    User:
      type: object
      required: [id, username]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      required: [token, expires_at, user]
      properties:
        token:
          type: string
          description: Opaque bearer token. Shown once; the server stores only its hash.
        expires_at:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"
    Health:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: string
          enum: [connected, unreachable]
    MaruMoriKeyRequest:
      type: object
      required: [apiKey]
      properties:
        apiKey:
          type: string
          format: password
          description: >
            The Learner's MaruMori API key. Write-only: encrypted at rest, never returned, never
            logged. Replaces any previously stored key.
          x-go-type: stdjson.RawMessage
          x-go-type-import:
            path: encoding/json
            name: stdjson
          x-go-type-skip-optional-pointer: true
    MaruMoriStatus:
      type: object
      description: >
        Whether the Learner has a MaruMori API key stored, and what the most recent Sync found.
        `lastSync` and `counts` are null before the first successful Sync. `lastFailure` reports the
        most recent failed Sync only while it is newer than `lastSync`.
      required: [connected]
      properties:
        connected:
          type: boolean
          description: Whether a MaruMori API key is stored. The key itself is never exposed.
        connectedAt:
          type: string
          format: date-time
          nullable: true
        lastSync:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/MaruMoriSyncRun"
        lastFailure:
          nullable: true
          description: >
            The most recent failed Sync, shown only while it is the newest news: null when a later
            Sync succeeded, and null when there is no failure. Its `error` never contains the API key.
          allOf:
            - $ref: "#/components/schemas/MaruMoriSyncRun"
        counts:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/MaruMoriStatusCounts"
    MaruMoriStatusCounts:
      type: object
      description: Totals over the Learner's stored knowledge state, from the last successful Sync.
      required: [kanji, vocabulary, vocabularyLinkRate]
      properties:
        kanji:
          type: integer
          description: Known kanji at SRS level 1 or above.
        vocabulary:
          type: integer
          description: Known vocabulary at SRS level 1 or above.
        vocabularyLinkRate:
          type: number
          minimum: 0
          maximum: 1
          description: Share of Known vocabulary linked to a JMdict entry (0..1).
        lastSyncAt:
          type: string
          format: date-time
          nullable: true
          description: When the data was last synced.
    MaruMoriSyncRun:
      type: object
      description: >
        One Sync run. A run that started but could not finish is `failed` with an `error`; it is
        returned as a 200 body, not an HTTP error.
      required: [id, status, startedAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [running, ok, failed]
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
        error:
          type: string
          nullable: true
          description: Why the Sync failed, in Learner-facing words. Never contains the API key.
        counts:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/MaruMoriCounts"
    MaruMoriCounts:
      type: object
      description: What one completed Sync found and stored.
      required:
        [kanji, vocabulary, grammarReviews, grammarLessons, linked, unlinked, ambiguous, new, levelChanges, disappeared, skippedLevelZero]
      properties:
        kanji:
          type: integer
          description: Known kanji (SRS level 1+) read from MaruMori.
        vocabulary:
          type: integer
          description: Known vocabulary (SRS level 1+) read from MaruMori.
        grammarReviews:
          type: integer
          description: Grammar review SRS levels recorded.
        grammarLessons:
          type: integer
          description: Grammar lesson SRS levels recorded.
        linked:
          type: integer
          description: Known Items linked to a KANJIDIC or JMdict entry.
        unlinked:
          type: integer
          description: Known Items kept by their MaruMori text only (no reference-data match).
        ambiguous:
          type: integer
          description: Known Items with more than one possible reference-data match; the closest by JLPT Level was chosen.
        new:
          type: integer
          description: Known Items that appeared since the previous Sync.
        levelChanges:
          type: integer
          description: Known Items whose SRS Level changed since the previous Sync.
        disappeared:
          type: integer
          description: Known Items no longer known in MaruMori; marked, never deleted.
        skippedLevelZero:
          type: integer
          description: Items reported at SRS level 0 (learning, not Known) and therefore not stored.
    GrammarJLPTLevel:
      type: string
      description: JLPT difficulty band the grammar point is catalogued under.
      enum: [N5, N4, N3, N2, N1]
    GrammarPointSummary:
      type: object
      required: [id, jlptLevel, catalogueNumber, pattern, meaning, hasExplanation, exampleCount]
      properties:
        id:
          type: integer
          format: int64
          description: Stable catalogue id (the grammar point's number in its level).
        jlptLevel:
          $ref: "#/components/schemas/GrammarJLPTLevel"
        catalogueNumber:
          type: integer
        pattern:
          type: string
          description: The teaching pattern, e.g. 〜てしまう.
        meaning:
          type: string
        hasExplanation:
          type: boolean
        exampleCount:
          type: integer
          description: Number of stored, JMdict-validated example sentences.
    GrammarPointPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GrammarPointSummary"
        total:
          type: integer
          description: Total grammar points matching the filter, before pagination.
        limit:
          type: integer
        offset:
          type: integer
    GrammarExample:
      type: object
      required: [id, sentenceJa, translationEn, spanStart, spanEnd, spanText, source]
      properties:
        id:
          type: string
          format: uuid
        sentenceJa:
          type: string
        translationEn:
          type: string
        spanStart:
          type: integer
          description: First rune offset (0-based) of the grammar span in sentenceJa.
        spanEnd:
          type: integer
          description: Rune offset just past the last character of the grammar span.
        spanText:
          type: string
          description: sentenceJa[spanStart:spanEnd]; the part of the sentence the point explains.
        source:
          type: string
          enum: [ai, manual]
    GrammarPointDetail:
      type: object
      required: [id, jlptLevel, catalogueNumber, pattern, meaning, variants, explanation, explanationEdited, examples]
      properties:
        id:
          type: integer
          format: int64
        jlptLevel:
          $ref: "#/components/schemas/GrammarJLPTLevel"
        catalogueNumber:
          type: integer
        pattern:
          type: string
        meaning:
          type: string
        variants:
          type: array
          items:
            type: string
        explanation:
          type: string
          description: >
            Markdown generated by the assigned AI Provider or edited by the Learner. Empty when the
            point has no explanation yet (no assigned provider, or generation never succeeded).
        explanationEdited:
          type: boolean
          description: True when the Learner edited the explanation; regeneration keeps such edits.
        examples:
          type: array
          items:
            $ref: "#/components/schemas/GrammarExample"
    GrammarPointUpdate:
      type: object
      required: [explanation]
      properties:
        explanation:
          type: string
          minLength: 1
          maxLength: 5000
    GenerateExamplesRequest:
      type: object
      properties:
        count:
          type: integer
          minimum: 1
          maximum: 30
          description: How many validated examples to add (default 10).
    CandidateRejection:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: >
            Stable reason code, e.g. unknown_word (the sentence or span is not in JMdict),
            span_text_mismatch, span_not_in_pattern, too_short, too_long, disallowed_characters,
            missing_translation.
        message:
          type: string
        sentence:
          type: string
          description: The rejected candidate sentence, when the provider supplied one.
    GenerationResult:
      type: object
      required: [generated, stored, rejected, rejections, examples]
      properties:
        generated:
          type: integer
          description: Candidates that passed validation this call.
        stored:
          type: integer
          description: New examples actually stored (duplicates already on the point are not counted).
        rejected:
          type: integer
          description: Candidates discarded by validation.
        rejections:
          type: array
          items:
            $ref: "#/components/schemas/CandidateRejection"
        note:
          type: string
          description: Present when generation stopped early, e.g. the per-point example cap was reached.
        examples:
          type: array
          items:
            $ref: "#/components/schemas/GrammarExample"
          description: Every example sentence stored on the point after generation.
    StartingLevelStatus:
      type: object
      description: >
        The Learner's Starting Level. `level` is null until onboarding chooses one; `added` and
        `removed` appear only on the PUT response, reporting what that change did to Seeded Grammar.
      required: [configured]
      properties:
        configured:
          type: boolean
          description: Whether the Learner has declared a Starting Level yet.
        level:
          type: string
          nullable: true
          enum: [N5, N4, N3, N2, N1]
          description: null until one is chosen.
        added:
          type: integer
          description: Grammar Points Seeded by the most recent change.
        removed:
          type: integer
          description: Seeded Grammar Points the most recent change dropped (Observed Grammar is never dropped).
    StartingLevelUpdate:
      type: object
      required: [level]
      properties:
        level:
          type: string
          enum: [N5, N4, N3, N2, N1]
          description: The Learner's declared starting level.
    GrammarReviewItem:
      type: object
      description: >
        One confirmed MaruMori grammar observation and its Catalogue Matching outcome. Unmatched
        entries have no `matchedPointId` and point at a possible missing Grammar Catalogue entry.
      required: [marumoriId, pattern, flagged]
      properties:
        marumoriId:
          type: string
          description: The observation's MaruMori id, e.g. Grammar/6578.
        pattern:
          type: string
          description: The pattern text MaruMori showed (empty when upstream sent none).
        jlptLevel:
          type: string
          enum: [N5, N4, N3, N2, N1]
          description: MaruMori's own level for the point, when it states one.
        matchedPointId:
          type: integer
          format: int64
          description: The Grammar Catalogue point this observation matched, when it matched one.
        flagged:
          type: boolean
          description: >
            True when the entry needs the Learner's eye: no match, or a duplicate pattern resolved
            without MaruMori's level.
    FocusSet:
      type: object
      description: >
        The Learner's current Focus Set (issue #7), in the order Practice should use it: pinned
        Newly Observed Grammar first, then ascending Mastery. `size` is the configured capacity;
        a Learner who knows fewer items simply gets a shorter set.
      required: [size, items]
      properties:
        size:
          type: integer
          description: The set's configured capacity (15–20; server config FOCUS_SET_SIZE).
        items:
          type: array
          items:
            $ref: "#/components/schemas/FocusSetItem"
    FocusSetItem:
      type: object
      description: >
        One Known Item in the Focus Set, with its current Mastery. Later features (Practice
        Sessions, Weak Signals ingestion) address the item by `kind` plus `itemRef`.
      required: [kind, itemRef, source, mastery, newlyObservedGrammar]
      properties:
        kind:
          type: string
          enum: [kanji, vocabulary, grammar]
        itemRef:
          type: string
          description: >
            The item's stable ref: the JMdict ent_seq (as text) for linked vocabulary, the literal
            for linked kanji, the MaruMori id for items no reference-data link covers yet, and the
            Grammar Catalogue point id (as text) for grammar.
        source:
          type: string
          enum: [marumori, seeded, observed]
          description: Why the item is known — Synced, Seeded Grammar, or Observed Grammar.
        mastery:
          type: number
          minimum: 0
          maximum: 1
          description: >
            The item's current Mastery score, recomputed from SRS Level, Level Trend, Practice
            Record and Weak Signals on this read. Never stored.
        srsLevel:
          type: integer
          nullable: true
          description: MaruMori's SRS Level for the item; null when it reports none (e.g. Seeded Grammar).
        newlyObservedGrammar:
          type: boolean
          description: True for Observed Grammar first seen within the new-grammar window; those items are pinned to the front.
