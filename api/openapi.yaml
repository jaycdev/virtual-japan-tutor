openapi: 3.0.3
info:
  title: Virtual Japan Tutor API
  version: 0.1.0
  description: >
    Source of truth for the HTTP API. Go server stubs and the TypeScript
    client are both generated from this file (run `pnpm generate`).
servers:
  - url: http://localhost:8080
# Authenticated by default: every operation requires a bearer session token unless it
# explicitly opts out with `security: []` (only /health and /auth/login do).
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      summary: Liveness and database connectivity check
      responses:
        "200":
          description: Server is up and the database is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Server is up but the database is unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /auth/login:
    post:
      operationId: login
      summary: Exchange a username and password for a session token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unknown user or wrong password (indistinguishable by design)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many failed attempts; retry after the number of seconds in Retry-After
          headers:
            Retry-After:
              required: true
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/logout:
    post:
      operationId: logout
      summary: Invalidate the current session token
      responses:
        "204":
          description: Session deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me:
    get:
      operationId: getMe
      summary: The authenticated user
      responses:
        "200":
          description: The current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /grammar/points:
    get:
      operationId: listGrammarPoints
      summary: Grammar points in catalogue order (level N5→N1, then catalogue number)
      parameters:
        - name: level
          in: query
          required: false
          schema:
            type: string
            enum: [N5, N4, N3, N2, N1]
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: A page of grammar points with their content status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrammarPointPage"
        "400":
          description: Unknown level or out-of-range limit/offset (code `bad_request`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /grammar/points/{id}:
    parameters:
      - $ref: "#/components/parameters/GrammarPointId"
    get:
      operationId: getGrammarPoint
      summary: Read a grammar point, generating missing content on first read
      description: >
        When the point has no explanation yet, or holds fewer than 5 example sentences, the server
        asks the AI Provider assigned to the `grammar_content` task and stores what it returns: the
        explanation first, then validated example sentences up to 5. Existing content is never
        replaced. A point with no content and no assigned provider is still answered 200 with an
        empty `explanation` and no `examples`.
      responses:
        "200":
          description: The grammar point with its explanation and validated example sentences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrammarPointDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateGrammarPoint
      summary: Edit the explanation of a grammar point
      description: >
        Manual edits are kept: regeneration and auto-generation never overwrite an explanation
        that was edited here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrammarPointUpdate"
      responses:
        "200":
          description: The updated grammar point
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrammarPointDetail"
        "400":
          description: Empty explanation or malformed body (code `bad_request`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /grammar/points/{id}/examples:
    parameters:
      - $ref: "#/components/parameters/GrammarPointId"
    post:
      operationId: generateGrammarExamples
      summary: Generate example sentences, validating each against JMdict before storing it
      description: >
        Candidates are generated through the assigned AI Provider and discarded when they fail
        validation (the sentence or its grammar span must tokenise into known JMdict words, the
        span must cover part of the pattern, and its length must be 5–40 characters). Rejected
        candidates are reported here, never stored.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateExamplesRequest"
      responses:
        "200":
          description: The newly stored examples plus counts of rejected candidates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationResult"
        "400":
          description: Out-of-range count or malformed body (code `bad_request`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: No AI Provider is assigned to the `grammar_content` task (code `no_ai_provider`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /grammar/points/{id}/explanation/regenerate:
    parameters:
      - $ref: "#/components/parameters/GrammarPointId"
    post:
      operationId: regenerateGrammarExplanation
      summary: Regenerate the explanation, replacing any existing one
      responses:
        "200":
          description: The grammar point with its new explanation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrammarPointDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: No AI Provider is assigned to the `grammar_content` task (code `no_ai_provider`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /ai-providers:
    get:
      operationId: listAiProviders
      summary: The Learner's saved AI Providers
      responses:
        "200":
          description: All providers, oldest first. API keys are never included.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiProvider"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createAiProvider
      summary: Save a new AI Provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiProviderCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiProvider"
        "400":
          description: Invalid name, base URL or model (code `invalid_provider`) or malformed body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: A provider with this name already exists (code `name_taken`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /ai-providers/{id}:
    parameters:
      - $ref: "#/components/parameters/ProviderId"
    get:
      operationId: getAiProvider
      summary: One AI Provider
      responses:
        "200":
          description: The provider (without its key)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiProvider"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateAiProvider
      summary: Change an AI Provider
      description: >
        Only the fields present are changed. `apiKey` omitted keeps the stored key; `null` or
        an empty string removes it (keyless endpoints such as Ollama need none).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiProviderUpdate"
      responses:
        "200":
          description: The updated provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiProvider"
        "400":
          description: Invalid name, base URL or model (code `invalid_provider`) or malformed body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Another provider already has this name (code `name_taken`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteAiProvider
      summary: Remove an AI Provider
      description: Rejected with 409 while the provider is assigned to a task; reassign the task first.
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The provider is assigned to a task (code `provider_in_use`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /ai-providers/{id}/test:
    parameters:
      - $ref: "#/components/parameters/ProviderId"
    post:
      operationId: testAiProvider
      summary: Check that the provider answers a tiny chat request
      description: >
        Always answers 200 when the provider exists; a failed check is `ok: false` with a
        readable `message`, not an HTTP error.
      responses:
        "200":
          description: The outcome of the check
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiProviderTestResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /ai-tasks:
    get:
      operationId: listAiTasks
      summary: Which AI Provider each task uses
      responses:
        "200":
          description: One entry per task, in a stable order; `providerId` is null when unassigned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiTaskAssignment"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /ai-tasks/{task}:
    put:
      operationId: setAiTask
      summary: Choose the AI Provider for a task
      parameters:
        - name: task
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AiTask"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerId]
              properties:
                providerId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: The new assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiTaskAssignment"
        "400":
          description: Malformed body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown task, or no such provider (code `not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: clearAiTask
      summary: Leave a task without an AI Provider
      parameters:
        - name: task
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AiTask"
      responses:
        "200":
          description: The task, now unassigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiTaskAssignment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown task (code `not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /marumori:
    get:
      operationId: getMaruMoriStatus
      summary: Whether MaruMori is connected, and what the last Sync found
      responses:
        "200":
          description: Current MaruMori status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaruMoriStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /marumori/key:
    put:
      operationId: setMaruMoriKey
      summary: Store the Learner's MaruMori API key
      description: >
        The key is encrypted at rest and never returned. It is not verified here: a rejected key
        surfaces as a failed Sync with a clear error. Replacing the key keeps already-synced data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaruMoriKeyRequest"
      responses:
        "200":
          description: Key stored; the new status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaruMoriStatus"
        "400":
          description: Missing or empty API key (code `invalid_key`) or malformed body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: deleteMaruMoriKey
      summary: Stop the MaruMori connection and forget the key
      description: Already-synced knowledge state and Sync history are kept.
      responses:
        "204":
          description: Key removed
        "401":
          $ref: "#/components/responses/Unauthorized"
  /marumori/sync:
    post:
      operationId: syncMaruMori
      summary: Sync the Learner's knowledge state from MaruMori now
      description: >
        Re-reads the Learner's Known Items and SRS levels from MaruMori and records what appeared,
        changed level or disappeared. Item content is never fetched or stored (see ADR-0002). A
        Sync that starts but fails still answers 200 with `status: "failed"` and an `error`.
      responses:
        "200":
          description: The Sync run that just finished
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaruMoriSyncRun"
        "400":
          description: No MaruMori API key stored yet (code `no_key`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: A Sync is already running for this Learner (code `sync_running`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /marumori/syncs:
    get:
      operationId: listMaruMoriSyncs
      summary: The Learner's recent Sync runs, newest first
      responses:
        "200":
          description: Recent Sync runs (a bounded window, e.g. the last 20)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaruMoriSyncRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /starting-level:
    get:
      operationId: getStartingLevel
      summary: The Learner's declared Starting Level, if they have chosen one
      description: >
        Onboarding shows its level picker while `configured` is false. Seeded Grammar — every
        Grammar Point at or below the level, known at medium Mastery — is applied when the level
        is set (issue #6).
      responses:
        "200":
          description: The current Starting Level state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartingLevelStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: setStartingLevel
      summary: Choose or change the Starting Level
      description: >
        Setting the level adds Seeded Grammar: every Grammar Point at or below it becomes a Known
        Item at medium Mastery. Changing it later adds or removes Seeded Grammar only; Observed
        Grammar from MaruMori Syncs is always kept.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartingLevelUpdate"
      responses:
        "200":
          description: The level now set, and how many points the change added or removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartingLevelStatus"
        "400":
          description: Missing or unknown level (code `invalid_level`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /grammar/review:
    get:
      operationId: listGrammarReviewItems
      summary: MaruMori grammar the Learner knows that the Catalogue Matching could not resolve cleanly
      description: >
        The settings "review these" list (issue #6): confirmed grammar observations whose Catalogue
        Matching found no Grammar Point at all, or resolved a duplicate pattern without MaruMori's
        JLPT Level. Unmatched entries are re-matched automatically by later Syncs once the
        catalogue gains the point.
      parameters:
        - name: flagged
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: false returns every observation, flagged or not, for a fuller picture.
      responses:
        "200":
          description: The Learner's grammar observations, oldest first (`observed_at`, MaruMori id as tie-break)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GrammarReviewItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /focus-set:
    get:
      operationId: getFocusSet
      summary: The rotating Focus Set of low-Mastery Known Items
      description: >
        The 15–20 Known Items Practice Sessions and Stories target (issue #7): the lowest-Mastery
        items, mixing vocabulary, kanji and grammar, in the order they should be practised. Items
        the Learner has demonstrably nailed (a run of correct Practice results spanning distinct UTC
        days) rotate out and the next weakest backfills; recently Observed Grammar is pinned to
        the front (docs/adr/0003). Mastery is recomputed from the stored signals on every read —
        it is never stored, and the app schedules nothing (docs/adr/0004).
      responses:
        "200":
          description: The current Focus Set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusSet"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /practice/sessions:
    post:
      operationId: startPracticeSession
      summary: Start a Practice Session drawn from the Focus Set
      description: >
        Builds a session of up to PRACTICE_SESSION_SIZE Exercises from the current Focus Set
        (issue #9): recognition questions — the Japanese item and four English meanings, the
        distractors drawn from the same Item kind at a similar JLPT Level — and grammar cloze
        questions, a Grammar Point's example sentence with the pattern blanked and pattern
        variants as choices. Items the set holds but the app has no content for (unlinked
        MaruMori items, grammar points with no example sentence) are skipped and counted in
        `skipped`. Pass `seed` to make exercise selection and option order deterministic; the
        server picks one when absent. A session lives in server memory for a bounded time
        (PRACTICE_SESSION_TTL); every answer is appended to the Practice Record, so Mastery and
        the Focus Set move as the Learner answers (docs/adr/0004).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PracticeSessionStart"
      responses:
        "200":
          description: The session and its exercises, in answer order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeSession"
        "409":
          description: >
            The Focus Set is empty — there is nothing to practise yet
            (code `practice_no_items`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /practice/sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: getPracticeSession
      summary: A Practice Session in progress, or its results once complete
      description: >
        The session's exercises with their answer state; once every exercise is answered the
        session is complete and carries its `results` summary. Unknown, expired or another
        user's sessions are all `not_found`.
      responses:
        "200":
          description: The current session view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeSession"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /practice/sessions/{sessionId}/answers:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: answerPracticeExercise
      summary: Answer one exercise of a Practice Session
      description: >
        Records the choice, appends the result to the Practice Record, and reports whether it
        was right. The result is written at most once per exercise: re-answering is
        `already_answered`. When the last exercise is answered the session completes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PracticeAnswer"
      responses:
        "200":
          description: Whether the answer was correct, and the session's new state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeAnswerResult"
        "400":
          description: Unknown exercise or option for this session (code `bad_request`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The exercise was already answered (code `already_answered`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /stories:
    get:
      operationId: listStories
      summary: A page of the Learner's Story Library, newest first
      description: >
        Stories the Learner has generated (issue #10), validated ones only: a Story that failed
        the kagome validation gate is kept for analysis, never offered. Each carries its rating
        when the Learner gave one. Generation is driven by the background scheduler — this list
        never triggers one.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: A page of stories with the total count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /stories/ready:
    get:
      operationId: getReadyStory
      summary: The story waiting to be read, opening it instantly
      description: >
        The one Story the background generator has ready for the Learner, served from storage —
        the request never waits on an AI provider. Opening it clears the ready marker, so the
        next background pass re-arms generation. `no_ready_story` when none is waiting. All
        `start`/`end` offsets in sentences and grammar spans are codepoint (rune) indexes into
        each sentence's `ja` text, counting from 0 — not UTF-16 indexes or byte offsets.
      responses:
        "200":
          description: The ready story
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Story"
        "404":
          description: No story is ready yet (code `no_ready_story`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /stories/{storyId}:
    parameters:
      - $ref: "#/components/parameters/StoryId"
    get:
      operationId: getStory
      summary: One story from the Learner's library
      description: >
        Full story view: tokenised sentences (kagome tokens tagged `known`/`unknown` at
        generation time, each with its reading and a `show_furigana` flag derived from the
        Learner's Furigana Threshold — Known Items at or above that SRS Level render without
        furigana), Grammar Spans, comprehension questions without their answers, and the
        vocabulary the story covers. Unknown or another user's stories are all `not_found`.
      responses:
        "200":
          description: The story
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Story"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /stories/{storyId}/rate:
    parameters:
      - $ref: "#/components/parameters/StoryId"
    post:
      operationId: rateStory
      summary: Thumbs up or down on a story
      description: >
        One rating per story, replaceable: up or down. Ratings steer the genre/theme of future
        generations — genres the Learner rated up are preferred, otherwise recent reading
        history, otherwise the generator asks the model to surprise them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoryRating"
      responses:
        "204":
          description: Recorded
        "400":
          description: Rating is neither up nor down (code `invalid_rating`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /stories/{storyId}/answers:
    parameters:
      - $ref: "#/components/parameters/StoryId"
    post:
      operationId: answerStoryQuestion
      summary: Answer one comprehension question of a story
      description: >
        Grades the chosen option for the question. The first answer for a story also appends
        one Practice Record per Focus Set vocabulary item the story covers (correct as this
        answer's verdict), marking the story practiced — later answers only grade.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoryAnswer"
      responses:
        "200":
          description: Whether the answer was right, and whether it wrote Practice Records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryAnswerResult"
        "400":
          description: No such question or option in this story (code `invalid_question` / `invalid_answer`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /story-settings:
    get:
      operationId: getStorySettings
      summary: Story settings for the Learner
      description: >
        The per-user Story settings: the Furigana Threshold (the SRS Level at or above which
        Known Items appear without furigana, GLOSSARY.md; default 3 on mastery's 1–9 scale),
        and the optional preferred genre and theme for future stories (empty means "surprise
        me" and the server picks, steered by ratings).
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorySettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: putStorySettings
      summary: Update the story settings
      description: >
        Changes how much furigana future story views show, and which genre/theme future
        stories aim for. Existing stories keep their stored token SRS Levels; the threshold
        is applied when a story is read. Empty preferredGenre/preferredTheme mean "surprise me".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorySettings"
      responses:
        "200":
          description: The stored settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorySettings"
        "400":
          description: Threshold outside 0–9 (`invalid_threshold`) or genre/theme over the length cap (`invalid_preference`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /reading-settings:
    get:
      operationId: getReadingSettings
      summary: Reading settings for the Learner
      description: >
        How the story reader behaves (issue #11): the Blur Translation preference
        (sentence translations start blurred in the Reading Panel; the Learner's
        click to reveal them is remembered here so the reading experience carries
        across sessions and devices).
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: putReadingSettings
      summary: Update the reading settings
      description: >
        Saves the Blur Translation preference. It is stored per Learner, so the
        reader looks the same on every session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadingSettings"
      responses:
        "200":
          description: The stored settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingSettings"
        "400":
          description: Body missing blurTranslation (`invalid_settings`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /item-lists:
    get:
      operationId: getItemLists
      summary: List the Learner's Item Lists
      description: >
        The Learner's Item Lists (issue #12) in creation order, each with its live item count
        and a Boosting flag. The built-in Saved list always exists: reads seed it for Learners
        who never touched the feature. `defaultListId` is the effective Save target — the
        configured Default List, or Saved when none is configured.
      responses:
        "200":
          description: The lists and the effective default
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemListsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createItemLists
      summary: Create an Item List
      description: >
        Names are unique per Learner ignoring case. `boosting` marks the list a Boosting List:
        its not-yet-Known members become Stretch Items in Practice Sessions, and saving a Known
        Item into it records a Weak Signal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemListCreateRequest"
      responses:
        "201":
          description: The created list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemList"
        "400":
          description: Name blank or over 60 characters (`bad_request`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Another list already has that name, ignoring case (`duplicate_name`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /item-lists/default:
    put:
      operationId: setDefaultItemList
      summary: Choose the Default List for saving
      description: >
        Points the one-tap Save at another list (issue #12). The list must be the Learner's own.
        Deleting the configured default falls back to Saved until another is chosen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [listId]
              properties:
                listId:
                  type: string
                  format: uuid
                  description: The list every Save targets until changed.
      responses:
        "204":
          description: The new Default List is stored
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /item-lists/{listId}:
    put:
      operationId: updateItemList
      summary: Rename or re-flag an Item List
      description: >
        Both fields are optional; omitted fields keep their current value. The built-in Saved
        list keeps its name forever (`reserved_list`) — its boosting flag is still editable.
      parameters:
        - $ref: "#/components/parameters/ListId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemListUpdateRequest"
      responses:
        "200":
          description: The updated list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemList"
        "400":
          description: Name blank, over 60 characters, or a rename of Saved (`bad_request` / `reserved_list`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Another list already has that name, ignoring case (`duplicate_name`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteItemList
      summary: Delete an Item List
      description: >
        Drops the list and its memberships; the items stay in every other list holding them.
        Saved cannot be deleted (`reserved_list`) — it is the fallback Save target.
      parameters:
        - $ref: "#/components/parameters/ListId"
      responses:
        "204":
          description: The list is gone
        "400":
          description: Attempt to delete Saved (`reserved_list`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /item-lists/{listId}/items:
    post:
      operationId: addItemToList
      summary: Save an item into one list
      description: >
        Places one Known Item (or any item the Learner taps) in the list — an item may sit in
        several lists at once, and saving the same pair twice is a no-op. When the list is a
        Boosting List and the item is already a Known Item, the save also records a Weak Signal
        (`boosting_list`): the Learner just flagged it as shaky.
      parameters:
        - $ref: "#/components/parameters/ListId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemListAddRequest"
      responses:
        "204":
          description: The membership is stored
        "400":
          description: Bad itemKind or blank itemRef (`bad_request`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: removeItemListItems
      summary: Remove one item from one list
      description: >
        Drops a single membership. Other lists holding the item are untouched, and the Practice
        Record keeps every answer given about it.
      parameters:
        - $ref: "#/components/parameters/ListId"
        - name: itemKind
          in: query
          required: false
          description: >
            Declared optional only so the auth middleware runs before parameter
            parsing; a missing value is answered 400 by the server.
          schema:
            $ref: "#/components/schemas/ItemKind"
        - name: itemRef
          in: query
          required: false
          description: >
            The item's stable ref, as everywhere items are addressed. Missing is
            answered 400 by the server.
          schema:
            type: string
      responses:
        "204":
          description: The membership is gone (deleting an absent pair is a no-op)
        "400":
          description: Bad itemKind (`bad_request`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /weak-signals:
    post:
      operationId: postWeakSignals
      summary: Report reader Weak Signals
      description: >
        The story reader's uncertainty markers (issue #12): a dictionary lookup held past the
        Learner's threshold, an opened Lookup Menu, and unblurring a Sentence Translation
        (which flags the sentence's Focus Set items). Trust model, decided for the ticket:
        the reader sees only server-rendered items, but keys arrive over the wire, so the
        server validates every one is this Learner's Known Item before storing — unknown or
        foreign keys are dropped silently. Only Known Items qualify: a plain lookup of an
        unknown word is learning, not a signal, and needs no report.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeakSignalBatchRequest"
      responses:
        "204":
          description: All qualifying signals stored (others skipped)
        "400":
          description: Over 50 signals, bad kind, blank ref or unknown reason (`bad_request`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /dictionary/entries/{entSeq}:
    get:
      operationId: getDictionaryEntry
      summary: Look a word up for the Dictionary Entry window
      description: >
        Everything the Dictionary Entry window shows for a tapped word (issue #11):
        every JMdict meaning with its parts of speech, all kanji forms and readings,
        the JLPT Level, the pitch pattern for the tapped reading (null when the
        Kanjium tables hold no rows for it — clients render the pitch graph only
        when there is data), and for each constituent kanji whether the Learner
        has it as a Known Item, with its SRS Level and Mastery. The word itself
        gets the same Known Item reporting. Optional surface/reading query
        parameters say which form the Learner tapped: the headword echo, the pitch
        lookup and the kanji breakdown follow them.
      parameters:
        - name: entSeq
          in: path
          required: true
          description: >
            JMdict ent_seq from the Story Token (or any known entry id). Declared as a
            plain string for the same reason as StoryId: the generated router binds path
            parameters before auth, so the handler parses it itself (404 if malformed).
          schema:
            type: string
        - name: surface
          in: query
          required: false
          description: The token surface the Learner tapped, when it is a kanji form.
          schema:
            type: string
        - name: reading
          in: query
          required: false
          description: The token's kana reading; selects which reading's pitch pattern is returned.
          schema:
            type: string
      responses:
        "200":
          description: >
            The entry. Words the tokeniser links without a JMdict row are answered
            too: found=false with empty senses/forms — the Lookup row then shows the
            word alone. 404 only answers for malformed entSeq values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DictionaryEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    StoryId:
      name: storyId
      in: path
      required: true
      description: >
        A Story's UUID. Declared as a plain string for the same reason as ProviderId: the
        generated router binds path parameters before auth, so the handler parses it itself
        (404 if malformed).
      schema:
        type: string
    SessionId:
      name: sessionId
      in: path
      required: true
      description: >
        A Practice Session's id, as returned by POST /practice/sessions. Plain string for the
        same reason as ProviderId: path parameters bind before auth runs.
      schema:
        type: string
    ProviderId:
      name: id
      in: path
      required: true
      description: >
        An AI Provider's UUID. Declared as a plain string on purpose: the generated router binds
        `format: uuid` parameters before the auth middleware runs, so a malformed id would be
        answered 400 to an unauthenticated caller. The handler parses it (404 if malformed).
      schema:
        type: string
    GrammarPointId:
      name: id
      in: path
      required: true
      description: >
        A grammar point's catalogue id. Declared as a plain string for the same reason as
        ProviderId: the generated router binds path parameters before auth, so the handler
        parses it itself (404 if malformed).
      schema:
        type: string
    ListId:
      name: listId
      in: path
      required: true
      description: >
        An Item List's UUID (issue #12). Plain string for the same reason as ProviderId: path
        parameters bind before auth, so the handler parses it itself (404 if malformed).
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Opaque session token from POST /auth/login, sent as `Authorization: Bearer <token>`."
  responses:
    Unauthorized:
      description: Missing, invalid or expired session token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such resource for the authenticated user (code `not_found`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    AiTask:
      type: string
      description: A job the app delegates to an AI Provider. Fixed set.
      enum: [story, grammar_content]
    AiProvider:
      type: object
      description: A saved OpenAI-compatible endpoint. The API key is write-only and never returned.
      required: [id, name, baseUrl, model, hasApiKey, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        baseUrl:
          type: string
          description: Normalised OpenAI-compatible base URL, e.g. https://api.openai.com/v1
        model:
          type: string
        hasApiKey:
          type: boolean
          description: Whether a key is stored. The key itself is never exposed, not even partially.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AiProviderCreate:
      type: object
      required: [name, baseUrl, model]
      properties:
        name:
          type: string
          description: Unique per Learner (case-insensitive).
        baseUrl:
          type: string
          description: Any http(s) OpenAI-compatible endpoint, including private/LAN/localhost addresses. A missing /v1 is added.
        model:
          type: string
        apiKey:
          type: string
          nullable: true
          format: password
          description: Omit, null or empty for endpoints that need no key.
          x-go-type: stdjson.RawMessage
          x-go-type-import:
            path: encoding/json
            name: stdjson
          x-go-type-skip-optional-pointer: true
    AiProviderUpdate:
      type: object
      properties:
        name:
          type: string
        baseUrl:
          type: string
        model:
          type: string
        apiKey:
          type: string
          nullable: true
          format: password
          description: Omitted keeps the stored key; null or empty removes it; any other value replaces it.
          x-go-type: stdjson.RawMessage
          x-go-type-import:
            path: encoding/json
            name: stdjson
          x-go-type-skip-optional-pointer: true
    AiProviderTestResult:
      type: object
      required: [ok, latencyMs, message]
      properties:
        ok:
          type: boolean
        latencyMs:
          type: integer
          format: int64
          description: Round-trip time of the connection check in milliseconds.
        message:
          type: string
          description: Human-readable outcome, e.g. "Connected" or why it failed.
        structuredOutput:
          type: string
          description: >
            How the endpoint handles JSON output, when the connection works: json_schema (best),
            json_object, prompt_only (JSON extracted from plain replies) or unavailable.
          enum: [json_schema, json_object, prompt_only, unavailable]
    AiTaskAssignment:
      type: object
      required: [task, providerId]
      properties:
        task:
          $ref: "#/components/schemas/AiTask"
        providerId:
          type: string
          format: uuid
          nullable: true
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable error code (e.g. unauthorized, invalid_credentials, too_many_attempts).
        message:
          type: string
    User:
      type: object
      required: [id, username]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      required: [token, expires_at, user]
      properties:
        token:
          type: string
          description: Opaque bearer token. Shown once; the server stores only its hash.
        expires_at:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"
    Health:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: string
          enum: [connected, unreachable]
    MaruMoriKeyRequest:
      type: object
      required: [apiKey]
      properties:
        apiKey:
          type: string
          format: password
          description: >
            The Learner's MaruMori API key. Write-only: encrypted at rest, never returned, never
            logged. Replaces any previously stored key.
          x-go-type: stdjson.RawMessage
          x-go-type-import:
            path: encoding/json
            name: stdjson
          x-go-type-skip-optional-pointer: true
    MaruMoriStatus:
      type: object
      description: >
        Whether the Learner has a MaruMori API key stored, and what the most recent Sync found.
        `lastSync` and `counts` are null before the first successful Sync. `lastFailure` reports the
        most recent failed Sync only while it is newer than `lastSync`.
      required: [connected]
      properties:
        connected:
          type: boolean
          description: Whether a MaruMori API key is stored. The key itself is never exposed.
        connectedAt:
          type: string
          format: date-time
          nullable: true
        lastSync:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/MaruMoriSyncRun"
        lastFailure:
          nullable: true
          description: >
            The most recent failed Sync, shown only while it is the newest news: null when a later
            Sync succeeded, and null when there is no failure. Its `error` never contains the API key.
          allOf:
            - $ref: "#/components/schemas/MaruMoriSyncRun"
        counts:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/MaruMoriStatusCounts"
    MaruMoriStatusCounts:
      type: object
      description: Totals over the Learner's stored knowledge state, from the last successful Sync.
      required: [kanji, vocabulary, vocabularyLinkRate]
      properties:
        kanji:
          type: integer
          description: Known kanji at SRS level 1 or above.
        vocabulary:
          type: integer
          description: Known vocabulary at SRS level 1 or above.
        vocabularyLinkRate:
          type: number
          minimum: 0
          maximum: 1
          description: Share of Known vocabulary linked to a JMdict entry (0..1).
        lastSyncAt:
          type: string
          format: date-time
          nullable: true
          description: When the data was last synced.
    MaruMoriSyncRun:
      type: object
      description: >
        One Sync run. A run that started but could not finish is `failed` with an `error`; it is
        returned as a 200 body, not an HTTP error.
      required: [id, status, startedAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [running, ok, failed]
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
        error:
          type: string
          nullable: true
          description: Why the Sync failed, in Learner-facing words. Never contains the API key.
        counts:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/MaruMoriCounts"
    MaruMoriCounts:
      type: object
      description: What one completed Sync found and stored.
      required:
        [kanji, vocabulary, grammarReviews, grammarLessons, linked, unlinked, ambiguous, new, levelChanges, disappeared, skippedLevelZero]
      properties:
        kanji:
          type: integer
          description: Known kanji (SRS level 1+) read from MaruMori.
        vocabulary:
          type: integer
          description: Known vocabulary (SRS level 1+) read from MaruMori.
        grammarReviews:
          type: integer
          description: Grammar review SRS levels recorded.
        grammarLessons:
          type: integer
          description: Grammar lesson SRS levels recorded.
        linked:
          type: integer
          description: Known Items linked to a KANJIDIC or JMdict entry.
        unlinked:
          type: integer
          description: Known Items kept by their MaruMori text only (no reference-data match).
        ambiguous:
          type: integer
          description: Known Items with more than one possible reference-data match; the closest by JLPT Level was chosen.
        new:
          type: integer
          description: Known Items that appeared since the previous Sync.
        levelChanges:
          type: integer
          description: Known Items whose SRS Level changed since the previous Sync.
        disappeared:
          type: integer
          description: Known Items no longer known in MaruMori; marked, never deleted.
        skippedLevelZero:
          type: integer
          description: Items reported at SRS level 0 (learning, not Known) and therefore not stored.
    GrammarJLPTLevel:
      type: string
      description: JLPT difficulty band the grammar point is catalogued under.
      enum: [N5, N4, N3, N2, N1]
    GrammarPointSummary:
      type: object
      required: [id, jlptLevel, catalogueNumber, pattern, meaning, hasExplanation, exampleCount]
      properties:
        id:
          type: integer
          format: int64
          description: Stable catalogue id (the grammar point's number in its level).
        jlptLevel:
          $ref: "#/components/schemas/GrammarJLPTLevel"
        catalogueNumber:
          type: integer
        pattern:
          type: string
          description: The teaching pattern, e.g. 〜てしまう.
        meaning:
          type: string
        hasExplanation:
          type: boolean
        exampleCount:
          type: integer
          description: Number of stored, JMdict-validated example sentences.
    GrammarPointPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GrammarPointSummary"
        total:
          type: integer
          description: Total grammar points matching the filter, before pagination.
        limit:
          type: integer
        offset:
          type: integer
    GrammarExample:
      type: object
      required: [id, sentenceJa, translationEn, spanStart, spanEnd, spanText, source]
      properties:
        id:
          type: string
          format: uuid
        sentenceJa:
          type: string
        translationEn:
          type: string
        spanStart:
          type: integer
          description: First rune offset (0-based) of the grammar span in sentenceJa.
        spanEnd:
          type: integer
          description: Rune offset just past the last character of the grammar span.
        spanText:
          type: string
          description: sentenceJa[spanStart:spanEnd]; the part of the sentence the point explains.
        source:
          type: string
          enum: [ai, manual]
    GrammarPointDetail:
      type: object
      required: [id, jlptLevel, catalogueNumber, pattern, meaning, variants, explanation, explanationEdited, examples]
      properties:
        id:
          type: integer
          format: int64
        jlptLevel:
          $ref: "#/components/schemas/GrammarJLPTLevel"
        catalogueNumber:
          type: integer
        pattern:
          type: string
        meaning:
          type: string
        variants:
          type: array
          items:
            type: string
        explanation:
          type: string
          description: >
            Markdown generated by the assigned AI Provider or edited by the Learner. Empty when the
            point has no explanation yet (no assigned provider, or generation never succeeded).
        explanationEdited:
          type: boolean
          description: True when the Learner edited the explanation; regeneration keeps such edits.
        examples:
          type: array
          items:
            $ref: "#/components/schemas/GrammarExample"
    GrammarPointUpdate:
      type: object
      required: [explanation]
      properties:
        explanation:
          type: string
          minLength: 1
          maxLength: 5000
    GenerateExamplesRequest:
      type: object
      properties:
        count:
          type: integer
          minimum: 1
          maximum: 30
          description: How many validated examples to add (default 10).
    CandidateRejection:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: >
            Stable reason code, e.g. unknown_word (the sentence or span is not in JMdict),
            span_text_mismatch, span_not_in_pattern, too_short, too_long, disallowed_characters,
            missing_translation.
        message:
          type: string
        sentence:
          type: string
          description: The rejected candidate sentence, when the provider supplied one.
    GenerationResult:
      type: object
      required: [generated, stored, rejected, rejections, examples]
      properties:
        generated:
          type: integer
          description: Candidates that passed validation this call.
        stored:
          type: integer
          description: New examples actually stored (duplicates already on the point are not counted).
        rejected:
          type: integer
          description: Candidates discarded by validation.
        rejections:
          type: array
          items:
            $ref: "#/components/schemas/CandidateRejection"
        note:
          type: string
          description: Present when generation stopped early, e.g. the per-point example cap was reached.
        examples:
          type: array
          items:
            $ref: "#/components/schemas/GrammarExample"
          description: Every example sentence stored on the point after generation.
    StartingLevelStatus:
      type: object
      description: >
        The Learner's Starting Level. `level` is null until onboarding chooses one; `added` and
        `removed` appear only on the PUT response, reporting what that change did to Seeded Grammar.
      required: [configured]
      properties:
        configured:
          type: boolean
          description: Whether the Learner has declared a Starting Level yet.
        level:
          type: string
          nullable: true
          enum: [N5, N4, N3, N2, N1]
          description: null until one is chosen.
        added:
          type: integer
          description: Grammar Points Seeded by the most recent change.
        removed:
          type: integer
          description: Seeded Grammar Points the most recent change dropped (Observed Grammar is never dropped).
    StartingLevelUpdate:
      type: object
      required: [level]
      properties:
        level:
          type: string
          enum: [N5, N4, N3, N2, N1]
          description: The Learner's declared starting level.
    GrammarReviewItem:
      type: object
      description: >
        One confirmed MaruMori grammar observation and its Catalogue Matching outcome. Unmatched
        entries have no `matchedPointId` and point at a possible missing Grammar Catalogue entry.
      required: [marumoriId, pattern, flagged]
      properties:
        marumoriId:
          type: string
          description: The observation's MaruMori id, e.g. Grammar/6578.
        pattern:
          type: string
          description: The pattern text MaruMori showed (empty when upstream sent none).
        jlptLevel:
          type: string
          enum: [N5, N4, N3, N2, N1]
          description: MaruMori's own level for the point, when it states one.
        matchedPointId:
          type: integer
          format: int64
          description: The Grammar Catalogue point this observation matched, when it matched one.
        flagged:
          type: boolean
          description: >
            True when the entry needs the Learner's eye: no match, or a duplicate pattern resolved
            without MaruMori's level.
    FocusSet:
      type: object
      description: >
        The Learner's current Focus Set (issue #7), in the order Practice should use it: pinned
        Newly Observed Grammar first, then ascending Mastery. `size` is the configured capacity;
        a Learner who knows fewer items simply gets a shorter set.
      required: [size, items]
      properties:
        size:
          type: integer
          description: The set's configured capacity (15–20; server config FOCUS_SET_SIZE).
        items:
          type: array
          items:
            $ref: "#/components/schemas/FocusSetItem"
    FocusSetItem:
      type: object
      description: >
        One Known Item in the Focus Set, with its current Mastery. Later features (Practice
        Sessions, Weak Signals ingestion) address the item by `kind` plus `itemRef`.
      required: [kind, itemRef, source, mastery, newlyObservedGrammar]
      properties:
        kind:
          $ref: "#/components/schemas/ItemKind"
        itemRef:
          type: string
          description: >
            The item's stable ref: the JMdict ent_seq (as text) for linked vocabulary, the literal
            for linked kanji, the MaruMori id for items no reference-data link covers yet, and the
            Grammar Catalogue point id (as text) for grammar.
        source:
          type: string
          enum: [marumori, seeded, observed]
          description: Why the item is known — Synced, Seeded Grammar, or Observed Grammar.
        mastery:
          type: number
          minimum: 0
          maximum: 1
          description: >
            The item's current Mastery score, recomputed from SRS Level, Level Trend, Practice
            Record and Weak Signals on this read. Never stored.
        srsLevel:
          type: integer
          nullable: true
          description: MaruMori's SRS Level for the item; null when it reports none (e.g. Seeded Grammar).
        newlyObservedGrammar:
          type: boolean
          description: True for Observed Grammar first seen within the new-grammar window; those items are pinned to the front.
    ItemKind:
      type: string
      enum: [kanji, vocabulary, grammar]
      description: >
        The kind of a Known Item — the same three kinds the Knowledge Store, the Focus Set and
        the Practice Record address items by.
    ItemList:
      type: object
      description: >
        One Item List (issue #12): a named group of items the Learner assembled. `boosting`
        marks a Boosting List — its not-yet-Known members become Stretch Items in Practice
        Sessions, and its Known members carry one Mastery boost (counted once however many
        Boosting Lists hold the item).
      required: [id, name, boosting, isDefault, itemCount]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        boosting:
          type: boolean
        isDefault:
          type: boolean
          description: True for the effective Default List — the configured Save target, or Saved when none is configured.
        itemCount:
          type: integer
          description: How many items the list holds right now.
    ItemListsResponse:
      type: object
      description: The Learner's Item Lists plus the effective Default List id.
      required: [items, defaultListId]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemList"
        defaultListId:
          type: string
          format: uuid
          description: The list a one-tap Save targets. Always resolves — Saved is the fallback.
    ItemListCreateRequest:
      type: object
      required: [name, boosting]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: Unique per Learner ignoring case. "Saved" is reserved for the built-in list.
        boosting:
          type: boolean
    ItemListUpdateRequest:
      type: object
      description: Omitted fields keep their current value.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        boosting:
          type: boolean
    ItemListAddRequest:
      type: object
      description: One item addressed the way every item in the app is addressed.
      required: [itemKind, itemRef]
      properties:
        itemKind:
          $ref: "#/components/schemas/ItemKind"
        itemRef:
          type: string
          description: >
            The item's stable ref: ent_seq text, kanji literal, MaruMori id or grammar point id.
    WeakSignalBatchRequest:
      type: object
      required: [signals]
      properties:
        signals:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/WeakSignalRequest"
    WeakSignalRequest:
      type: object
      required: [itemKind, itemRef, reason]
      properties:
        itemKind:
          $ref: "#/components/schemas/ItemKind"
        itemRef:
          type: string
        reason:
          type: string
          enum: [lookup, menu_open, translation_unblur]
          description: >
            What the Learner did: held a lookup past their threshold, opened the Lookup Menu,
            or unblurred a Sentence Translation (one signal per Focus Set item in the sentence).
            `boosting_list` is written by the server on save-to-a-Boosting-List, never accepted here.
    PracticeSessionStart:
      type: object
      description: >
        Session options. Everything is optional: an empty body (or no body at all) starts a
        session with a server-chosen seed.
      properties:
        seed:
          type: integer
          format: int64
          description: >
            Makes item selection, distractor choice and option order deterministic — the same
            seed and Focus Set produce the same session. Omit for a server-chosen seed.
    PracticeSession:
      type: object
      description: >
        One Practice Session (issue #9): its exercises in answer order, and once every
        exercise is answered, the results summary. Sessions are short-lived server state.
      required: [id, state, exercises, skipped]
      properties:
        id:
          type: string
          description: The session id to use for answers and further reads.
        state:
          $ref: "#/components/schemas/PracticeState"
        targetSize:
          type: integer
          description: The session's configured target size (server config PRACTICE_SESSION_SIZE). A learner with a shorter Focus Set simply gets fewer exercises.
        skipped:
          type: integer
          description: >
            Focus Set items the session could not build an exercise for — unlinked MaruMori
            items (no stored content) and grammar points with no example sentence.
        exercises:
          type: array
          items:
            $ref: "#/components/schemas/PracticeExercise"
        results:
          description: Present once the session is complete.
          allOf:
            - $ref: "#/components/schemas/PracticeResults"
    PracticeExercise:
      type: object
      description: >
        One Exercise. `recognition` shows a Known Item in Japanese with four English meaning
        options; `grammar_cloze` shows a Grammar Point's example sentence with the pattern
        replaced by ＿＿＿ and pattern variants as options. The correct answer is never sent
        before the Learner answers — once answered, `chosenOptionId` and `correctOptionId`
        reveal both sides so a resumed session shows the same feedback.
      required: [id, kind, itemKind, itemRef, prompt, answered]
      properties:
        id:
          type: string
          description: The exercise id within its session, used when answering.
        kind:
          type: string
          enum: [recognition, grammar_cloze]
        itemKind:
          $ref: "#/components/schemas/ItemKind"
        itemRef:
          type: string
          description: The Focus Set item ref this exercise practises (same addressing as the Practice Record).
        prompt:
          type: string
          description: >
            The Japanese side: the vocabulary's kanji form (reading when it has none), the
            kanji, or the example sentence with the grammar pattern replaced by ＿＿＿.
        instruction:
          type: string
          description: What to do, in English ("What does this mean?" / "Which pattern completes the sentence?").
        options:
          type: array
          items:
            $ref: "#/components/schemas/PracticeOption"
        answered:
          type: boolean
        correct:
          type: boolean
          description: Present once answered — whether the Learner's choice was right.
        chosenOptionId:
          type: string
          description: Present once answered — the option the Learner chose.
        correctOptionId:
          type: string
          description: Present once answered — the option that holds the right answer.
    PracticeOption:
      type: object
      required: [id, text]
      properties:
        id:
          type: string
          description: Stable within the exercise ("a"…"d"); send it in the answer.
        text:
          type: string
    PracticeAnswer:
      type: object
      required: [exerciseId, optionId]
      properties:
        exerciseId:
          type: string
        optionId:
          type: string
    PracticeAnswerResult:
      type: object
      required: [correct, correctOptionId, state]
      properties:
        correct:
          type: boolean
        correctOptionId:
          type: string
          description: Lets the UI reveal the right answer after a miss.
        state:
          $ref: "#/components/schemas/PracticeState"
    PracticeState:
      type: string
      enum: [in_progress, complete]
      description: A Practice Session's state — complete once every Exercise has been answered. Its value after each answer is what the answer result reports.
    PracticeResults:
      type: object
      description: The session's results summary, present once complete.
      required: [total, correct]
      properties:
        total:
          type: integer
        correct:
          type: integer
        items:
          type: array
          description: Per-item results, in exercise order — what was appended to the Practice Record.
          items:
            $ref: "#/components/schemas/PracticeResultsItem"
    PracticeResultsItem:
      type: object
      required: [itemKind, itemRef, correct]
      properties:
        itemKind:
          $ref: "#/components/schemas/ItemKind"
        itemRef:
          type: string
        correct:
          type: boolean
    StoryRating:
      type: string
      enum: [up, down]
      description: A Learner's verdict on a story; upvoted genres steer future generation.
    StorySettings:
      type: object
      required: [furiganaThresholdSrsLevel]
      properties:
        furiganaThresholdSrsLevel:
          type: integer
          minimum: 0
          maximum: 9
          description: >
            The Furigana Threshold (GLOSSARY.md): Known Items with an SRS Level at or above this
            value are shown without furigana; below it, and for unknown tokens with kanji in
            their surface, the reading is shown. mastery's 1–9 scale; the default is 3.
        preferredGenre:
          type: string
          maxLength: 60
          description: >
            The genre the Learner wants for their stories ("travel", "mystery", ...). Empty or
            absent means "surprise me" — the server then picks, steered by ratings. Prompt-only:
            it never relaxes the validation gate, so an unfillable preference falls back rather
            than forcing bad output.
        preferredTheme:
          type: string
          maxLength: 200
          description: >
            A free-text theme for the Learner's stories ("a robot running a ramen shop"). Empty
            or absent means no theme. Prompt-only, like preferredGenre.
    StoryAnswer:
      type: object
      required: [questionIndex, answerIndex]
      properties:
        questionIndex:
          type: integer
          minimum: 0
        answerIndex:
          type: integer
          minimum: 0
          description: The index (from 0) into the question's optionsJa.
    StoryAnswerResult:
      type: object
      required: [correct]
      properties:
        correct:
          type: boolean
        practiceRecorded:
          type: boolean
          description: >
            True only for the first answer ever for this story: it appended one Practice Record
            per Focus Set vocabulary item the story covers.
    StoryPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Story"
        total:
          type: integer
          description: How many stories exist in total (validated ones), for paging.
        limit:
          type: integer
        offset:
          type: integer
    Story:
      type: object
      required: [id, genre, text, sentences, questions, vocabItems, createdAt]
      properties:
        id:
          type: string
        genre:
          type: string
        text:
          type: string
          description: The sentences' ja text joined, for plain display.
        createdAt:
          type: string
          format: date-time
        rating:
          $ref: "#/components/schemas/StoryRating"
          description: The Learner's own rating, when they gave one.
        attempts:
          type: integer
          description: Generation attempts used (1 = validated on the first try).
        sentences:
          type: array
          items:
            $ref: "#/components/schemas/StorySentence"
        questions:
          type: array
          items:
            $ref: "#/components/schemas/StoryQuestion"
        vocabItems:
          type: array
          items:
            $ref: "#/components/schemas/StoryVocabItem"
    StorySentence:
      type: object
      required: [ja, en, tokens, grammarSpans]
      properties:
        ja:
          type: string
        en:
          type: string
          description: English translation for comprehension help.
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/StoryToken"
        grammarSpans:
          type: array
          items:
            $ref: "#/components/schemas/StoryGrammarSpan"
    StoryToken:
      type: object
      required: [surface, start, end, tag, showFurigana]
      properties:
        surface:
          type: string
        start:
          type: integer
          description: Codepoint (rune) index into the sentence's ja text, counting from 0.
        end:
          type: integer
          description: Codepoint index just past the token's last character.
        reading:
          type: string
          description: The surface's kana reading (furigana material), empty when the tokeniser has none.
        dictionary:
          type: string
          description: Dictionary (base) form; for linked vocabulary, the entry's headword.
        entSeq:
          type: integer
          format: int64
          description: JMdict ent_seq when the token linked to a dictionary entry. Unlinked items cannot match Known Items and count as unknown.
        tag:
          type: string
          enum: [known, unknown]
          description: Known-Item state at generation time.
        srsLevel:
          type: integer
          description: MaruMori SRS Level for known linked items (drives furigana).
        showFurigana:
          type: boolean
          description: >
            Whether to render the reading above the surface. True only when the surface actually
            contains kanji AND the token is unknown, or a Known Item below the Learner's Furigana
            Threshold; kana-only surfaces never show ruby (their reading is the surface).
    StoryQuestion:
      type: object
      required: [position, promptJa, optionsJa]
      properties:
        position:
          type: integer
        promptJa:
          type: string
        optionsJa:
          type: array
          items:
            type: string
    StoryVocabItem:
      type: object
      required: [entSeq, ja, isKnown, isFocus]
      properties:
        entSeq:
          type: integer
          format: int64
        ja:
          type: string
        en:
          type: string
        isKnown:
          type: boolean
          description: Whether it was a Known Item at generation time.
        isFocus:
          type: boolean
          description: >
            Whether it belongs to the Focus Set the story was built around; comprehension
            answers write Practice Records for exactly these.
    StoryGrammarSpan:
      type: object
      description: >
        A stretch of a sentence annotated with the grammar point it exercises. Offsets are
        codepoint (rune) indexes into the sentence's ja text, counting from 0 — the same units
        the tokeniser reports — so clients can slice and highlight without byte arithmetic.
        The point's pattern, meaning and level ride along (issue #11) so hovering a Grammar
        Span shows the Grammar Point instantly, without a second request.
      required: [start, end, grammarPointId, isFocus, pattern, meaning, jlptLevel]
      properties:
        start:
          type: integer
        end:
          type: integer
        grammarPointId:
          type: string
          description: The grammar_points catalogue id.
        isFocus:
          type: boolean
          description: Whether the story was built around this grammar point (focus spans get the stronger underline).
        pattern:
          type: string
          description: The Grammar Point's pattern as catalogued (e.g. "～てしまう").
        meaning:
          type: string
          description: The Grammar Point's one-line meaning.
        jlptLevel:
          $ref: "#/components/schemas/GrammarJLPTLevel"
    ReadingSettings:
      type: object
      description: >
        Per-Learner reader preferences (issue #11, extended by issue #12), stored so the
        reading experience is the same in every session and on every device.
      required: [blurTranslation, lookupHoldMs]
      properties:
        blurTranslation:
          type: boolean
          description: >
            Blur sentence translations in the Reading Panel until the Learner clicks to reveal
            them. Defaults to true.
        lookupHoldMs:
          type: integer
          minimum: 0
          maximum: 10000
          description: >
            How long the Learner must hold a dictionary lookup open before it counts as a Weak
            Signal (issue #12): the Lookup Menu stays open past this many milliseconds, or the
            menu is opened at all, and the item gets a signal. 0 signals every lookup; the
            default is 800. The timer runs in the reader; only a threshold hit is reported.
    DictionaryEntry:
      type: object
      description: >
        Everything the Dictionary Entry window shows for a looked-up word (issue #11): all
        JMdict senses with their parts of speech, every kanji form and reading, the JLPT
        Level, the pitch pattern for the tapped reading, and the Learner's Known Item state
        for the word and each of its constituent kanji.
      required: [entSeq, found, headword, reading, jlptLevel, senses, kanjiForms, readings, pitch, srsLevel, mastery, kanji]
      properties:
        entSeq:
          type: integer
          format: int64
        found:
          type: boolean
          description: >
            false when the tokeniser linked the token but JMdict has no row (rare) — the
            window then shows the word alone.
        headword:
          type: string
          description: The form shown — the tapped surface when it is one of the entry's kanji forms, else the entry's first kanji form, else the first reading.
        reading:
          type: string
          description: The reading shown — the tapped reading when the entry has it, else the entry's first reading.
        jlptLevel:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/GrammarJLPTLevel"
          description: The easiest JLPT Level the word is listed at, null when it is on no list.
        senses:
          type: array
          description: Every JMdict sense, in dictionary order; the Lookup row shows the first few glosses.
          items:
            $ref: "#/components/schemas/DictionarySense"
        kanjiForms:
          type: array
          description: All kanji forms of the entry, in JMdict order.
          items:
            type: string
        readings:
          type: array
          description: All readings of the entry, in JMdict order.
          items:
            type: string
        pitch:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PitchPattern"
          description: >
            Kanjium pitch data for the shown reading (ADR-0006). Null when the pitch_accents
            tables have no rows for the pair — render the pitch graph only when this is present.
        srsLevel:
          type: integer
          nullable: true
          description: MaruMori SRS Level when the word itself is a Known Item, null otherwise.
        mastery:
          type: number
          format: double
          nullable: true
          description: The word's Mastery when it is a Known Item, null otherwise.
        kanji:
          type: array
          description: The constituent kanji of the shown headword, in order, each with the Learner's Known Item state.
          items:
            $ref: "#/components/schemas/DictionaryKanji"
    DictionarySense:
      type: object
      required: [glosses, partsOfSpeech]
      properties:
        glosses:
          type: array
          items:
            type: string
        partsOfSpeech:
          type: array
          description: Parts of speech in JMdict's words ("noun", "transitive verb", …).
          items:
            type: string
    PitchPattern:
      type: object
      description: >
        One reading's pitch pattern from Kanjium (ADR-0006). The client draws the
        mora graph from these numbers; no new scraping happens for this feature.
      required: [reading, moraCount, accentPosition, heiban, downstepAfterMora]
      properties:
        reading:
          type: string
          description: The kana reading this pattern belongs to.
        moraCount:
          type: integer
          description: Moras in the reading (approximated from kana; sound changes not split).
        accentPosition:
          type: integer
          description: >
            Kanjium's accent number — 0 is heiban (no downstep); N means the downstep
            comes after mora N.
        heiban:
          type: boolean
          description: True when there is no downstep — the graph shows the flat pattern explicitly.
        downstepAfterMora:
          type: integer
          description: The mora index (1-based) after which the pitch drops; equals moraCount for an accent-on-last-mora word, moraCount+1 (i.e. nowhere) when heiban.
        tag:
          type: string
          description: Kanjium's optional tag for the pattern (e.g. a variant marker), empty when none.
    DictionaryKanji:
      type: object
      required: [literal, known, srsLevel, mastery]
      properties:
        literal:
          type: string
        known:
          type: boolean
          description: Whether the Learner has this kanji as a Known Item.
        srsLevel:
          type: integer
          nullable: true
          description: MaruMori SRS Level when known, null otherwise.
        mastery:
          type: number
          format: double
          nullable: true
          description: Mastery when known, null otherwise.
