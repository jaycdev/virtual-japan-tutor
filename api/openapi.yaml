openapi: 3.0.3
info:
  title: Virtual Japan Tutor API
  version: 0.1.0
  description: >
    Source of truth for the HTTP API. Go server stubs and the TypeScript
    client are both generated from this file (run `pnpm generate`).
servers:
  - url: http://localhost:8080
# Authenticated by default: every operation requires a bearer session token unless it
# explicitly opts out with `security: []` (only /health and /auth/login do).
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      summary: Liveness and database connectivity check
      responses:
        "200":
          description: Server is up and the database is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Server is up but the database is unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /auth/login:
    post:
      operationId: login
      summary: Exchange a username and password for a session token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unknown user or wrong password (indistinguishable by design)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many failed attempts; retry after the number of seconds in Retry-After
          headers:
            Retry-After:
              required: true
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/logout:
    post:
      operationId: logout
      summary: Invalidate the current session token
      responses:
        "204":
          description: Session deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me:
    get:
      operationId: getMe
      summary: The authenticated user
      responses:
        "200":
          description: The current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /ai-providers:
    get:
      operationId: listAiProviders
      summary: The Learner's saved AI Providers
      responses:
        "200":
          description: All providers, oldest first. API keys are never included.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiProvider"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createAiProvider
      summary: Save a new AI Provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiProviderCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiProvider"
        "400":
          description: Invalid name, base URL or model (code `invalid_provider`) or malformed body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: A provider with this name already exists (code `name_taken`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /ai-providers/{id}:
    parameters:
      - $ref: "#/components/parameters/ProviderId"
    get:
      operationId: getAiProvider
      summary: One AI Provider
      responses:
        "200":
          description: The provider (without its key)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiProvider"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateAiProvider
      summary: Change an AI Provider
      description: >
        Only the fields present are changed. `apiKey` omitted keeps the stored key; `null` or
        an empty string removes it (keyless endpoints such as Ollama need none).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiProviderUpdate"
      responses:
        "200":
          description: The updated provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiProvider"
        "400":
          description: Invalid name, base URL or model (code `invalid_provider`) or malformed body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Another provider already has this name (code `name_taken`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteAiProvider
      summary: Remove an AI Provider
      description: Rejected with 409 while the provider is assigned to a task; reassign the task first.
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The provider is assigned to a task (code `provider_in_use`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /ai-providers/{id}/test:
    parameters:
      - $ref: "#/components/parameters/ProviderId"
    post:
      operationId: testAiProvider
      summary: Check that the provider answers a tiny chat request
      description: >
        Always answers 200 when the provider exists; a failed check is `ok: false` with a
        readable `message`, not an HTTP error.
      responses:
        "200":
          description: The outcome of the check
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiProviderTestResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /ai-tasks:
    get:
      operationId: listAiTasks
      summary: Which AI Provider each task uses
      responses:
        "200":
          description: One entry per task, in a stable order; `providerId` is null when unassigned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiTaskAssignment"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /ai-tasks/{task}:
    put:
      operationId: setAiTask
      summary: Choose the AI Provider for a task
      parameters:
        - name: task
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AiTask"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerId]
              properties:
                providerId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: The new assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiTaskAssignment"
        "400":
          description: Malformed body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown task, or no such provider (code `not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: clearAiTask
      summary: Leave a task without an AI Provider
      parameters:
        - name: task
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AiTask"
      responses:
        "200":
          description: The task, now unassigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiTaskAssignment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown task (code `not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /marumori:
    get:
      operationId: getMaruMoriStatus
      summary: Whether MaruMori is connected, and what the last Sync found
      responses:
        "200":
          description: Current MaruMori status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaruMoriStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /marumori/key:
    put:
      operationId: setMaruMoriKey
      summary: Store the Learner's MaruMori API key
      description: >
        The key is encrypted at rest and never returned. It is not verified here: a rejected key
        surfaces as a failed Sync with a clear error. Replacing the key keeps already-synced data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaruMoriKeyRequest"
      responses:
        "200":
          description: Key stored; the new status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaruMoriStatus"
        "400":
          description: Missing or empty API key (code `invalid_key`) or malformed body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: deleteMaruMoriKey
      summary: Stop the MaruMori connection and forget the key
      description: Already-synced knowledge state and Sync history are kept.
      responses:
        "204":
          description: Key removed
        "401":
          $ref: "#/components/responses/Unauthorized"
  /marumori/sync:
    post:
      operationId: syncMaruMori
      summary: Sync the Learner's knowledge state from MaruMori now
      description: >
        Re-reads the Learner's Known Items and SRS levels from MaruMori and records what appeared,
        changed level or disappeared. Item content is never fetched or stored (see ADR-0002). A
        Sync that starts but fails still answers 200 with `status: "failed"` and an `error`.
      responses:
        "200":
          description: The Sync run that just finished
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaruMoriSyncRun"
        "400":
          description: No MaruMori API key stored yet (code `no_key`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: A Sync is already running for this Learner (code `sync_running`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /marumori/syncs:
    get:
      operationId: listMaruMoriSyncs
      summary: The Learner's recent Sync runs, newest first
      responses:
        "200":
          description: Recent Sync runs (a bounded window, e.g. the last 20)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaruMoriSyncRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  parameters:
    ProviderId:
      name: id
      in: path
      required: true
      description: >
        An AI Provider's UUID. Declared as a plain string on purpose: the generated router binds
        `format: uuid` parameters before the auth middleware runs, so a malformed id would be
        answered 400 to an unauthenticated caller. The handler parses it (404 if malformed).
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Opaque session token from POST /auth/login, sent as `Authorization: Bearer <token>`."
  responses:
    Unauthorized:
      description: Missing, invalid or expired session token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such resource for the authenticated user (code `not_found`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    AiTask:
      type: string
      description: A job the app delegates to an AI Provider. Fixed set.
      enum: [story, grammar_content]
    AiProvider:
      type: object
      description: A saved OpenAI-compatible endpoint. The API key is write-only and never returned.
      required: [id, name, baseUrl, model, hasApiKey, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        baseUrl:
          type: string
          description: Normalised OpenAI-compatible base URL, e.g. https://api.openai.com/v1
        model:
          type: string
        hasApiKey:
          type: boolean
          description: Whether a key is stored. The key itself is never exposed, not even partially.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AiProviderCreate:
      type: object
      required: [name, baseUrl, model]
      properties:
        name:
          type: string
          description: Unique per Learner (case-insensitive).
        baseUrl:
          type: string
          description: Any http(s) OpenAI-compatible endpoint, including private/LAN/localhost addresses. A missing /v1 is added.
        model:
          type: string
        apiKey:
          type: string
          nullable: true
          format: password
          description: Omit, null or empty for endpoints that need no key.
          x-go-type: stdjson.RawMessage
          x-go-type-import:
            path: encoding/json
            name: stdjson
          x-go-type-skip-optional-pointer: true
    AiProviderUpdate:
      type: object
      properties:
        name:
          type: string
        baseUrl:
          type: string
        model:
          type: string
        apiKey:
          type: string
          nullable: true
          format: password
          description: Omitted keeps the stored key; null or empty removes it; any other value replaces it.
          x-go-type: stdjson.RawMessage
          x-go-type-import:
            path: encoding/json
            name: stdjson
          x-go-type-skip-optional-pointer: true
    AiProviderTestResult:
      type: object
      required: [ok, latencyMs, message]
      properties:
        ok:
          type: boolean
        latencyMs:
          type: integer
          format: int64
          description: Round-trip time of the connection check in milliseconds.
        message:
          type: string
          description: Human-readable outcome, e.g. "Connected" or why it failed.
        structuredOutput:
          type: string
          description: >
            How the endpoint handles JSON output, when the connection works: json_schema (best),
            json_object, prompt_only (JSON extracted from plain replies) or unavailable.
          enum: [json_schema, json_object, prompt_only, unavailable]
    AiTaskAssignment:
      type: object
      required: [task, providerId]
      properties:
        task:
          $ref: "#/components/schemas/AiTask"
        providerId:
          type: string
          format: uuid
          nullable: true
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable error code (e.g. unauthorized, invalid_credentials, too_many_attempts).
        message:
          type: string
    User:
      type: object
      required: [id, username]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      required: [token, expires_at, user]
      properties:
        token:
          type: string
          description: Opaque bearer token. Shown once; the server stores only its hash.
        expires_at:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"
    Health:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: string
          enum: [connected, unreachable]
    MaruMoriKeyRequest:
      type: object
      required: [apiKey]
      properties:
        apiKey:
          type: string
          format: password
          description: >
            The Learner's MaruMori API key. Write-only: encrypted at rest, never returned, never
            logged. Replaces any previously stored key.
          x-go-type: stdjson.RawMessage
          x-go-type-import:
            path: encoding/json
            name: stdjson
          x-go-type-skip-optional-pointer: true
    MaruMoriStatus:
      type: object
      description: >
        Whether the Learner has a MaruMori API key stored, and what the most recent Sync found.
        `lastSync` and `counts` are null before the first successful Sync.
      required: [connected]
      properties:
        connected:
          type: boolean
          description: Whether a MaruMori API key is stored. The key itself is never exposed.
        connectedAt:
          type: string
          format: date-time
          nullable: true
        lastSync:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/MaruMoriSyncRun"
        counts:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/MaruMoriStatusCounts"
    MaruMoriStatusCounts:
      type: object
      description: Totals over the Learner's stored knowledge state, from the last successful Sync.
      required: [kanji, vocabulary, vocabularyLinkRate]
      properties:
        kanji:
          type: integer
          description: Known kanji at SRS level 1 or above.
        vocabulary:
          type: integer
          description: Known vocabulary at SRS level 1 or above.
        vocabularyLinkRate:
          type: number
          minimum: 0
          maximum: 1
          description: Share of Known vocabulary linked to a JMdict entry (0..1).
        lastSyncAt:
          type: string
          format: date-time
          nullable: true
          description: When the data was last synced.
    MaruMoriSyncRun:
      type: object
      description: >
        One Sync run. A run that started but could not finish is `failed` with an `error`; it is
        returned as a 200 body, not an HTTP error.
      required: [id, status, startedAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [running, ok, failed]
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
        error:
          type: string
          nullable: true
          description: Why the Sync failed, in Learner-facing words. Never contains the API key.
        counts:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/MaruMoriCounts"
    MaruMoriCounts:
      type: object
      description: What one completed Sync found and stored.
      required:
        [kanji, vocabulary, grammarReviews, grammarLessons, linked, unlinked, ambiguous, new, levelChanges, disappeared, skippedLevelZero]
      properties:
        kanji:
          type: integer
          description: Known kanji (SRS level 1+) read from MaruMori.
        vocabulary:
          type: integer
          description: Known vocabulary (SRS level 1+) read from MaruMori.
        grammarReviews:
          type: integer
          description: Grammar review SRS levels recorded.
        grammarLessons:
          type: integer
          description: Grammar lesson SRS levels recorded.
        linked:
          type: integer
          description: Known Items linked to a KANJIDIC or JMdict entry.
        unlinked:
          type: integer
          description: Known Items kept by their MaruMori text only (no reference-data match).
        ambiguous:
          type: integer
          description: Known Items with more than one possible reference-data match; the closest by JLPT Level was chosen.
        new:
          type: integer
          description: Known Items that appeared since the previous Sync.
        levelChanges:
          type: integer
          description: Known Items whose SRS Level changed since the previous Sync.
        disappeared:
          type: integer
          description: Known Items no longer known in MaruMori; marked, never deleted.
        skippedLevelZero:
          type: integer
          description: Items reported at SRS level 0 (learning, not Known) and therefore not stored.
